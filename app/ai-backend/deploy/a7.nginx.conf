# A7 AI 后端反向代理 —— 对齐 /etc/nginx/conf.d/ai-print.conf 的现有模式。
# 服务器上以 /etc/nginx/conf.d/a7.conf.disabled 落地(.disabled 不被 nginx 加载 → 零风险)。
#
# 启用步骤(eddie 定好域名后):
#   1) 把下面 server_name 改成正式域名;
#   2) 重命名:mv /etc/nginx/conf.d/a7.conf.disabled /etc/nginx/conf.d/a7.conf
#   3) nginx -t && systemctl reload nginx
#   4)(若 CF 用 Full/Strict 回源 HTTPS)certbot --nginx -d <域名>  自动加 443 server(同其他站)
#
# Cloudflare(eddie 手动配):
#   - DNS:<域名> A 记录 → 47.103.157.81,开橙云(代理)
#   - Network → WebSockets:开启(默认开;/stream 依赖)
#   - SSL/TLS 模式:Full(原站已有 Certbot 证书时,推荐)或 Flexible(只用本 :80、原站免证书,最省事)
server {
    listen 80;
    server_name a7.coolai.tech;   # TODO(eddie): 换成正式域名

    client_max_body_size 200M;     # /process 上传音频(LFASR 上限 500M;A7 录音通常很小)

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # /stream 是 WebSocket:必须放行 upgrade
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # /process 转写+纪要可达 60s+;/stream 长连:给足超时
        proxy_connect_timeout 75s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }
}
